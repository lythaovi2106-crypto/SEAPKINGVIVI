<link rel="icon" href="icon-192.png">

<style>
/* VOICE: a warm, focused speaking coach — direct, encouraging, no fluff.
   IDEA: a radio studio's "on air" practice sheet: today's cue card + a run-sheet of steps.
   PICTURE: the working thing itself — today's cue card and checklist, big day number.
   COLOUR and TYPE: on-air red lead, deep plum studio band, one sun-yellow accent; Archivo + Inter.
   LAYOUT: top bar + tabs; each view one calm column or two balanced columns, stacking under 760px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#141119);--ink:light-dark(#1d1a22,#f1edf4);
--mut:light-dark(#655e6c,#aaa1b2);--line:light-dark(#e6e1ea,#2f2838);--card:light-dark(#ffffff,#1c1723);
--soft:light-dark(#f5f2f8,#221c2a);--red:light-dark(#cf3b23,#ff6d52);--redsoft:light-dark(#fdebe7,#3a1f1c);
--plum:light-dark(#2a1c3c,#1f1530);--sun:#f4c20d;--ok:light-dark(#1d7a4b,#55d690);--oksoft:light-dark(#e5f5ec,#16301f);
--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.6vw,48px);font-weight:800}h2{font-size:clamp(22px,2.6vw,28px);font-weight:700}h3{font-size:18px;font-weight:700}
p{margin:.4em 0}a{color:var(--red)}
.band{padding:clamp(22px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;max-width:1180px;margin:0 auto;padding:10px max(5vw,16px) 0;flex-wrap:wrap}
.brand{font:800 20px Archivo,sans-serif;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--redsoft)}
.status{margin-left:auto;font-size:13px;color:var(--mut)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1180px;margin:0 auto;padding:6px max(5vw,16px) 0}
nav.tabs a{flex:none;padding:10px 14px;border-radius:10px 10px 0 0;text-decoration:none;color:var(--mut);font-weight:600;font-size:15px;border-bottom:3px solid transparent}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--red)}
button,.btn{font:600 15px Inter,sans-serif;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent}
button.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
button:disabled{opacity:.5;cursor:not-allowed}
button.mic{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.mic.live{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--redsoft)}}
@media(prefers-reduced-motion:reduce){button.mic.live{animation:none}}
input,select,textarea{font:16px Inter,sans-serif;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
textarea{width:100%;min-height:96px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.soft{background:var(--soft);border-radius:14px;padding:14px}
.mut{color:var(--mut)}.small{font-size:14px}.tiny{font-size:13px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;color:var(--ink)}
.chip.red{background:var(--redsoft);color:var(--red)}
.hero{background:var(--plum);color:#f6f1fa}
.hero .mut{color:#cbbfd8}.hero .chip{background:rgba(255,255,255,.12);color:#fff}
.daynum{font:800 clamp(64px,10vw,120px)/0.9 Archivo,sans-serif;color:var(--sun)}
.cue{border-left:4px solid var(--sun);padding:6px 0 6px 14px;margin:14px 0}
.cue li{margin:4px 0}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo input{width:24px;height:24px;min-height:0;accent-color:var(--red)}
.todo .t{font-weight:600}.todo li.done .t{text-decoration:line-through;color:var(--mut)}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s}
.phase{margin-bottom:28px}
.week{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media(max-width:700px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}.week{grid-template-columns:minmax(0,1fr)}}
.dc{text-align:left;min-height:64px;padding:8px 10px;border-radius:12px;font-weight:500;font-size:13px;line-height:1.3;display:flex;flex-direction:column;gap:2px}
.dc b{font:700 13px Archivo,sans-serif;color:var(--mut)}
.dc.done{background:var(--oksoft);border-color:transparent}.dc.cur{border:2px solid var(--red)}
.dc.rev{background:var(--soft)}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:8px}
.subnav a{flex:none;padding:6px 12px;border-radius:99px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
@media(min-width:900px){.subnav{position:sticky;top:96px;background:var(--bg);z-index:5}}
section.sec{padding:22px 0;border-top:1px solid var(--line);scroll-margin-top:150px}
.chunks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.ck{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px}
.ck .en{font-weight:600}.ck .vi{font-size:14px;color:var(--mut)}
.icon{min-height:36px;min-width:36px;padding:4px 8px;border-radius:10px;font-size:14px}
.pat{padding:12px 0;border-bottom:1px dashed var(--line)}
.pat .f{font:700 17px Archivo,sans-serif;color:var(--red)}
.line{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px;border-radius:14px;margin:6px 0;border:1px solid var(--line)}
.line.now{border-color:var(--red);background:var(--redsoft)}
.who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px Archivo,sans-serif;background:var(--plum);color:#fff}
.who.B{background:var(--red)}
.line .en{font-size:17px;font-weight:500}.line .vi{font-size:14px;color:var(--mut)}
.blind .line .en{filter:blur(6px)}.blind .line .en:hover,.blind .line .en.peek{filter:none}
.novi .line .vi{display:none}
.res{font-size:14px;margin-top:6px}.w-ok{color:var(--ok);font-weight:600}.w-miss{color:var(--bad);text-decoration:underline wavy}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;padding:6px 0 6px 40px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--sun);color:#1d1a22;font:700 14px Archivo;display:grid;place-items:center}
.timer{font:800 clamp(48px,8vw,80px)/1 Archivo,sans-serif;font-variant-numeric:tabular-nums}
.rounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rd{padding:12px;border-radius:14px;border:1px solid var(--line)}
.rd.on{border:2px solid var(--red)}
.meter{display:grid;grid-template-columns:70px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.meter .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fb{margin-top:14px}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:520px){.scores{grid-template-columns:repeat(2,minmax(0,1fr))}.rounds{grid-template-columns:minmax(0,1fr)}}
.sc{padding:10px;border-radius:12px;background:var(--soft);text-align:center}.sc b{display:block;font:800 26px Archivo}
.fix{padding:10px 0;border-bottom:1px solid var(--line)}
.fix s{color:var(--bad)}.fix ins{color:var(--ok);text-decoration:none;font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px}
.msg.ai{background:var(--soft);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--plum);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .tip{margin-top:6px;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--card);color:var(--ink)}
.flash{min-height:200px;display:grid;place-items:center;text-align:center;padding:24px;border-radius:18px;background:var(--plum);color:#fff}
.flash .q{font:700 22px Archivo}.flash .a{font-size:20px;color:var(--sun);margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;color:var(--mut)}
.note{font-size:13px;color:var(--mut)}
.empty{padding:28px;text-align:center;border:2px dashed var(--line);border-radius:18px}
.loading{display:flex;gap:10px;align-items:center;padding:18px;border-radius:14px;background:var(--soft)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;display:none}
.hide{display:none!important}
.planrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.planrow:last-child{border-bottom:0}.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ladder{display:flex;gap:4px;margin-top:10px}.rung{display:flex;flex-direction:column;gap:4px;min-width:34px}.rung .bar{height:12px;border-radius:4px}.rung .bar>i{border-radius:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding:6px 0}
.heat i{border-radius:3px;background:var(--soft)}.heat .h1{background:color-mix(in srgb,var(--red) 25%,var(--soft))}.heat .h2{background:color-mix(in srgb,var(--red) 50%,var(--soft))}.heat .h3{background:color-mix(in srgb,var(--red) 75%,var(--soft))}.heat .h4{background:var(--red)}
.cbx{min-height:0!important;width:20px;height:20px;accent-color:var(--red)}
details.lvl{border-top:1px solid var(--line);padding:10px 0}details.lvl summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;font:600 18px Archivo,sans-serif;padding:10px 0;list-style:none}
details.lvl summary::-webkit-details-marker{display:none}details.lvl summary::before{content:"+";font:700 20px Archivo;color:var(--red);width:20px;flex:none}details.lvl[open] summary::before{content:"–"}
details.lvl summary>span:first-of-type{flex:1}
.sitlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.week .tiny{margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}@media(max-width:760px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.units{display:grid;gap:10px;margin-top:10px}.ugrid{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.uc{position:relative;width:36px;height:36px;min-height:36px;padding:0;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.uc i{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--red) 45%,transparent)}.uc.full i{background:var(--red)}
.uc span{position:relative;font:700 12px Archivo,sans-serif}.uc.full span{color:#fff}
.libi{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.tl{padding:10px 0;border-top:1px solid var(--line)}.tle{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:5px 0}
.modal{position:fixed;inset:0;background:rgba(10,6,16,.55);z-index:60;display:grid;place-items:center;padding:16px}
.mbox{background:var(--bg);color:var(--ink);border-radius:18px;padding:20px;width:min(640px,100%);max-height:92vh;overflow-y:auto}
pre,.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

  <div class="topin">

async function ask(prompt,onProg,tier){

 const t=r.text||"";const a=t.indexOf("{"),b=t.lastIndexOf("}");
 if(a<0||b<a)throw{code:"bad_json"};return JSON.parse(t.slice(a,b+1))}
function aiErr(e){if(e&&e.code==="no_ai")return PLAT.noAiMsg;
 if(e&&e.code==="cancelled")return"Đã huỷ.";
 if(e&&e.code==="bad_key")return"API key không đúng hoặc hết hạn — kiểm tra ở tab Đồng bộ.";
 if(e&&e.code==="network")return"Không kết nối được tới dịch vụ AI. Kiểm tra mạng rồi thử lại.";
 if(e&&e.code==="api")return"Dịch vụ AI báo lỗi: "+(e.message||"")+". Kiểm tra tên model ở tab Đồng bộ.";
 if(e&&e.code==="not_granted")return"Bạn chưa cho phép app dùng AI. Bấm lại và chọn Cho phép.";
 if(e&&e.code==="rate_limited")return"AI đang bận, đợi một chút rồi thử lại.";return"AI trả lời chưa đúng định dạng — bấm thử lại."}

function libDesc(t){if(!t)return null;if(t.custom)return{id:t.id,k:"custom",name:t.t,vi:t.vi,cust:t};
 if(t.review)return{id:t.id,k:"review",name:t.vi,vi:t.unitName,d:t.d,L:t.L};return{id:t.id,k:"topic",name:t.t,vi:t.vi,d:t.d,L:t.L}}
function lib(desc,fn,ev){if(!desc||!desc.id)return;const td=todayStr();let it=LIB.items[desc.id];
 if(!it){it=LIB.items[desc.id]={...desc,first:td,last:td,n:0,done:0,sh:0,wpm:0,fb:[],turns:0,days:0}}
 else Object.assign(it,{name:desc.name||it.name,vi:desc.vi||it.vi});
 if(it.lastDay!==td){it.days=(it.days||0)+1;it.lastDay=td}
 it.last=td;fn&&fn(it);
 if(ev){LIB.ev.unshift({at:new Date().toISOString(),id:desc.id,w:ev});LIB.ev=LIB.ev.slice(0,400)}
 libSave()}

 for(const h of P.f432||[]){const s=SLOTS.find(x=>x.id===h.id);if(s)lib(libDesc(s),it=>{it.wpm=Math.max(it.wpm||0,h.wpm[2]||0)})}
 LIB.seeded=true;libSave()}

function lkey(t){const r=t.L?roundOf(t.L):1;return "lesson-"+t.id+"-"+lessonLevel(t)+(r>1?"-r"+r:"")}
async function vLesson(){
 const t=curTopic();
 if(!openCustom&&t.review)return vReview(t);
 const lv=lessonLevel(t),r=t.L?roundOf(t.L):1;
 app.innerHTML=`<div class="band"><div class="wrap">
 <p class="small mut">${openCustom?"Chủ đề tự chọn":"Buổi "+t.d+" · Cấp "+t.L+" · Chặng "+t.u+" · "+esc(t.unitName)+(r>1?" · Vòng "+r:"")}</p>

 <div class="row" style="margin:10px 0"><span class="chip red">${REG[t.r]}</span><span class="chip">Trình độ ${lv}</span><span class="chip">Trọng tâm: ${esc(t.g)}</span></div>
 <div id="lbody"><div class="loading"><div class="spin"></div>Đang mở bài…</div></div></div></div>`;

function drawGen(t,err){
 $("#lbody").innerHTML=`<div class="grid2" style="margin-top:12px"><div class="card"><h2>Tạo bài học</h2>
 <p class="mut">AI soạn: 10 cụm từ hay dùng khi nói, 5 mẫu câu, mẹo ngữ pháp khi nói, hội thoại 12 câu để shadowing, dàn ý + bài nói mẫu, 5 câu hỏi luyện nói và tình huống đóng vai.</p>
 ${err?`<p style="color:var(--bad)">${esc(err)}</p>`:""}
 <button class="pri" id="gen">Soạn bài học bằng AI</button><p class="note">Mất khoảng 20–40 giây. Bài được lưu lại để học lại.</p></div>

 bindSay($("#lbody"));$("#gen").onclick=()=>genLesson(t)}
async function genLesson(t){
 const lv=lessonLevel(t),r=t.L?roundOf(t.L):1;const b=$("#lbody");
 b.innerHTML=`<div class="loading"><div class="spin"></div><span id="gp">AI đang soạn bài…</span></div>`;
 const reg={c:"casual everyday",n:"neutral, polite",f:"formal, professional"}[t.r];
 const prompt=`You are an expert English speaking coach for Vietnamese adults. The learner reads well and knows a lot of vocabulary but freezes when speaking: they can't retrieve words fast and don't know how to build spoken sentences. Build a speaking lesson that gives them ready-made chunks and frames.
Topic: ${t.t}${t.vi!==t.t?" ("+t.vi+")":""}. Register: ${reg}. Level: ${lv} (CEFR). Focus: ${t.g}. ${t.p.length?"Key sentence frames to include: "+t.p.join(" | ")+".":""}
${r>1?`This is round ${r} on this topic: the learner has done it before. Use a completely different situation and angle, fresher vocabulary and slightly more demanding language than a first lesson.`:""}
If the topic is written in Vietnamese, interpret it and write the English title.
Return ONLY one JSON object, no markdown fences, exactly this shape:
{"title":"English title","intro_vi":"1-2 câu tiếng Việt: hôm nay học nói gì, dùng trong tình huống nào",
"chunks":[{"en":"high-frequency spoken chunk, 2-7 words","vi":"nghĩa tiếng Việt tự nhiên"}],
"patterns":[{"pattern":"sentence frame using …","example":"full natural example","vi":"khi nào dùng, sắc thái"}],
"grammar":{"point":"short name","explain_vi":"giải thích ngắn bằng tiếng Việt cách dùng khi NÓI","examples":["ex1","ex2","ex3"],"mistake_vi":"một lỗi người Việt hay mắc và cách sửa"},
"dialogue":{"setting_vi":"bối cảnh ngắn","roleA":"short role name","roleB":"short role name","lines":[{"s":"A","en":"line","vi":"nghĩa"}]},
"monologue":{"outline_vi":["ý 1","ý 2","ý 3","ý 4"],"cues":["English keyword cue 1","cue 2","cue 3","cue 4"],"text":"model talk"},
"questions":["q1","q2","q3","q4","q5"],
"pron":[{"item":"word or phrase","tip_vi":"mẹo phát âm, nối âm, nhấn trọng âm"}],
"roleplay":{"ai_role":"who the AI plays","user_role":"who the learner plays","goal_vi":"mục tiêu của cuộc hội thoại","opening":"AI's first in-character line"}}
Rules: exactly 10 chunks, 5 patterns, 12 dialogue lines alternating A and B (B is the learner's likely role), each line under 22 words, natural spoken English with contractions, reuse the chunks in the dialogue and the talk. Model talk: first person, ${["C1","C2"].includes(lv)?"170-230":"120-170"} words, follows the outline, uses the frames. Questions: open, personal, increasing difficulty. Exactly 3 pron tips. Vietnamese must have full diacritics.`;
 try{const L=await ask(prompt,n=>{const g=$("#gp");if(g)g.textContent="AI đang soạn bài… "+n+" ký tự"},"default");
  if(!L.chunks||!L.dialogue)throw{code:"bad_json"};
  const k=lkey(t);lessonCache[k]=L;save(k,L);lib(libDesc(t),it=>{it.n=(it.n||0)+1;it.lastOpen=todayStr()},"Soạn bài mới"+(r>1?" (vòng "+r+")":""));if(curTopic().id===t.id&&view==="lesson")drawLesson(t,L)}
 catch(e){if(curTopic().id===t.id&&view==="lesson")drawGen(t,aiErr(e))}}

function compare(target,said){const a=words(target),b=words(said);const n=a.length,m=b.length;
 const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 const pct=n?Math.round(hit.filter(Boolean).length/n*100):0;
 return{pct,html:`<div>${a.map((w,k)=>`<span class="${hit[k]?"w-ok":"w-miss"}">${esc(w)}</span>`).join(" ")}</div><div class="tiny ${pct>=80?"w-ok":"mut"}">${pct>=80?"Tốt! Nói lại 1–2 lần nữa cho trôi.":"Chữ gạch đỏ là chỗ chưa khớp — nghe chậm rồi thử lại."}</div>`}}

 out.innerHTML=`<div class="loading"><div class="spin"></div>AI đang nghe lại và sửa…</div>`;
 const wc=words(text).length,wpm=secs>5?Math.round(wc/(secs/60)):null;const lv=lessonLevel(dayInfo(P.day));
 const prompt=`You are a warm but precise English speaking coach for a Vietnamese adult learner (target level ${lv}). The learner SPOKE the answer below; it is a speech-to-text transcript, so ignore punctuation and capitalisation and don't penalise likely recognition glitches.
Topic: ${topic}
Question / task: ${question}
Transcript: """${text.slice(0,5000)}"""
${wpm?"Speaking rate: about "+wpm+" words per minute.":""}
Return ONLY one JSON object, no markdown:
{"scores":{"grammar":0-10,"vocabulary":0-10,"fluency":0-10,"relevance":0-10},"summary_vi":"2 câu nhận xét tiếng Việt, khích lệ nhưng thật","good":["điểm làm tốt (tiếng Việt)"],"corrections":[{"wrong":"exact phrase from the transcript","right":"corrected phrase","why_vi":"giải thích ngắn tiếng Việt"}],"natural":"a natural, native-like version of the whole answer one level above the learner, keeping their ideas, spoken style","upgrade":[{"en":"better chunk to use next time","vi":"nghĩa"}],"next_vi":"một việc cụ thể để thử ở lần nói tiếp theo"}
At most 6 corrections, most important first. Exactly 3 upgrade chunks. Vietnamese with full diacritics.`;
 try{const F=await ask(prompt,null,"default");drawFB(F,out,{wc,wpm});const av=fbAvg(F.scores||{});if(lb)lib(lb,it=>{if(av!=null)it.fb=[av,...(it.fb||[])].slice(0,8)},(kind||"AI chấm câu trả lời")+(av!=null?": "+String(av).replace(".",",")+"/10":""));onDone&&onDone()}
 catch(e){out.innerHTML=`<p style="color:var(--bad)">${esc(aiErr(e))}</p>`}}
function drawFB(F,out,st){const s=F.scores||{};
 out.innerHTML=`<div class="scores">${[["grammar","Ngữ pháp"],["vocabulary","Từ vựng"],["fluency","Trôi chảy"],["relevance","Đúng ý"]].map(([k,v])=>`<div class="sc"><b>${esc(s[k]??"–")}</b><span class="tiny">${v}</span></div>`).join("")}</div>
 <p class="small mut" style="margin-top:8px">${st.wc} từ${st.wpm?` · khoảng ${st.wpm} từ/phút`:""}</p>
 <p>${esc(F.summary_vi)}</p>${(F.good||[]).length?`<p class="small"><b>Làm tốt:</b> ${F.good.map(esc).join("; ")}</p>`:""}

 ${(F.upgrade||[]).length?`<h3 style="margin-top:12px">Cụm từ nâng cấp</h3>${F.upgrade.map(u=>`<div class="small">${esc(u.en)} — <span class="mut">${esc(u.vi)}</span> <button class="icon ghost" data-nb='${esc(JSON.stringify({en:u.en,vi:u.vi,type:"chunk"}))}'>+ Sổ</button></div>`).join("")}`:""}
 ${F.next_vi?`<p class="soft small" style="margin-top:12px"><b>Lần sau thử:</b> ${esc(F.next_vi)}</p>`:""}`;
 bindSay(out);out.querySelectorAll("[data-nb]").forEach(b=>b.onclick=()=>addNB(JSON.parse(b.dataset.nb)));
 out.querySelector("[data-sf]").onclick=()=>{let n=0;(F.corrections||[]).slice(0,5).forEach(c=>{if(!NB.some(x=>x.en===c.right)){NB.unshift({en:c.right,vi:c.why_vi,wrong:c.wrong,type:"fix",at:todayStr(),box:0,due:todayStr()});n++}});save("notebook",NB);toast("Đã lưu "+n+" câu sửa")};
 const sn=out.querySelector("[data-sn]");sn.onclick=()=>{let fin="",part="";micStart({btn:sn,onPartial:x=>part=x,onFinal:x=>{fin+=" "+x;part=""},onEnd:()=>{const said=(fin+" "+part).trim();if(!said)return;const r=compare(F.natural,said);out.querySelector("[data-nr]").innerHTML=r.pct+"% · "+r.html}})}}
function setup432(t,L,day){
 let secs=[120,90,60],round=0,startT=0,tick=null,rec=[null,null,null],fin="",part="",running=false;
 const ft=$("#ft"),fr=$("#fr"),gb=$("#fgo");const mono=L.monologue||{};
 function paint(){$("#frds").innerHTML=secs.map((s,i)=>`<div class="rd ${i===round?"on":""}"><b>Lượt ${i+1}</b><div class="small mut">${fmt(s)}</div><div class="small">${rec[i]?rec[i].wc+" từ · "+rec[i].wpm+" từ/phút":"—"}</div></div>`).join("");
  const done=rec.filter(Boolean);const mx=Math.max(1,...done.map(r=>r.wpm));
  const prev=(P.f432||[]).filter(h=>h.id===t.id);
  $("#fstat").innerHTML=(done.length?`<div class="small mut">Tốc độ nói (từ/phút)</div>${rec.map((r,i)=>r?`<div class="meter"><span>Lượt ${i+1}</span><div class="bar"><i style="width:${Math.round(r.wpm/mx*100)}%"></i></div><span class="num">${r.wpm}</span></div>`:"").join("")}
  ${done.length===3?`<p class="small">${rec[2].wpm>rec[0].wpm?"Lượt 3 nhanh hơn lượt 1 "+(rec[2].wpm-rec[0].wpm)+" từ/phút — độ trôi chảy đang tăng.":"Lượt 3 chưa nhanh hơn — lần sau chỉ giữ ý chính và dùng lại cụm từ đã nói ở lượt 1."}</p><button class="pri sm" id="f3fb">AI nhận xét lượt 3</button><div id="f3out" class="fb"></div>`:""}`:"")
  +(prev.length?`<p class="tiny mut" style="margin-top:10px">Lần trước với chủ đề này: ${prev.slice(0,3).map(h=>esc(h.at)+": "+h.wpm.join("→")).join(" · ")}</p>`:"");
  const fb=$("#f3fb");if(fb)fb.onclick=()=>feedback({lb:libDesc(t),kind:"AI chấm độc thoại 4/3/2",topic:L.title||t.t,question:"4/3/2 monologue about: "+(L.title||t.t)+". Outline: "+(mono.cues||[]).join(", "),text:rec[2].text,secs:rec[2].secs,out:$("#f3out")});
  fr.textContent=round<3?"Lượt "+(round+1):"Đã xong 3 lượt";gb.textContent=round<3?"Bắt đầu lượt "+(round+1):"Làm lại từ đầu";if(!running)ft.textContent=fmt(round<3?secs[round]:0)}
 $("#fmode").onchange=e=>{if(running)return;secs=e.target.value.split(",").map(Number);round=0;rec=[null,null,null];paint()};
 function endRound(){if(!running)return;running=false;clearInterval(tick);const used=Math.max(1,(Date.now()-startT)/1000);
  const text=(fin+" "+part).trim();const wc=words(text).length;rec[round]={text,wc,secs:used,wpm:Math.round(wc/(used/60))};
  if(round===2){lib(libDesc(t),it=>{it.wpm=Math.max(it.wpm||0,rec[2].wpm)},"Độc thoại 4/3/2: "+rec.map(r=>r.wpm).join(" → ")+" từ/phút");check(day,"f432");if(!openCustom)touchTopic(t.id);P.f432=[{id:t.id,at:todayStr(),wpm:rec.map(r=>r.wpm)},...(P.f432||[])].slice(0,120);saveP()}
  round++;paint()}
 gb.onclick=()=>{if(running){if(micT)micStop();else endRound();return}
  if(round>=3){round=0;rec=[null,null,null];paint();return}
  fin="";part="";micStart({btn:gb,onPartial:x=>{part=x;mark()},onFinal:x=>{fin+=" "+x;part=""},onEnd:endRound});
  running=true;startT=Date.now();gb.textContent="Đang nói — bấm để dừng";
  tick=setInterval(()=>{const l=secs[round]-(Date.now()-startT)/1000;ft.textContent=fmt(l);if(l<=0){if(micT)micStop();else endRound()}},250)};
 $("#fstop").onclick=()=>{if(micT)micStop();else endRound()};
 paint()}

const DATA_KEY=k=>k==="progress"||k==="library"||k==="notebook"||k==="custom"||/^log-\d{4}$/.test(k)||/^lesson-/.test(k);
function mergeKey(k,a,b){
 if(a==null)return b;if(b==null)return a;
 if(k==="progress"){const o={...a,...b};const mx=(x,y)=>Math.max(+x||0,+y||0);
  o.day=mx(a.day,b.day);o.streak=mx(a.streak,b.streak);o.last=(a.last||"")>(b.last||"")?a.last:b.last;o.prior=mx(a.prior,b.prior);
  o.totals={};for(const t of new Set([...Object.keys(a.totals||{}),...Object.keys(b.totals||{})]))o.totals[t]=mx((a.totals||{})[t],(b.totals||{})[t]);
  o.round={};for(const L of new Set([...Object.keys(a.round||{}),...Object.keys(b.round||{})]))o.round[L]=mx((a.round||{})[L],(b.round||{})[L]);
  o.checks={...(a.checks||{})};for(const [d,v] of Object.entries(b.checks||{}))o.checks[d]=[...new Set([...(o.checks[d]||[]),...v])];
  o.done={...(a.done||{})};for(const [id,v] of Object.entries(b.done||{})){const x=o.done[id];o.done[id]=!x?v:{n:mx(x.n,v.n),last:x.last>v.last?x.last:v.last}}
  const uniq=(arr,f)=>{const m=new Map();arr.forEach(x=>m.set(f(x),x));return[...m.values()]};
  o.tests=uniq([...(a.tests||[]),...(b.tests||[])],x=>x.at+"|"+x.cefr+"|"+Math.round(x.hours)).sort((x,y)=>x.at<y.at?1:-1).slice(0,60);
  o.f432=uniq([...(a.f432||[]),...(b.f432||[])],x=>x.id+"|"+x.at+"|"+(x.wpm||[]).join(",")).sort((x,y)=>x.at<y.at?1:-1).slice(0,120);
  o.gate=null;return o}
 if(k==="notebook"){const m=new Map();for(const x of [...a,...b]){const y=m.get(x.en);if(!y||(x.box||0)>(y.box||0)||((x.box||0)===(y.box||0)&&(x.due||"")>(y.due||"")))m.set(x.en,x)}
  return [...m.values()].sort((x,y)=>(y.at||"")<(x.at||"")?-1:1).slice(0,1000)}
 if(k==="library"){const o={items:{...(a.items||{})},ev:[],seeded:true};const mx=(x,y)=>Math.max(+x||0,+y||0);
  for(const [id,v] of Object.entries(b.items||{})){const x=o.items[id];if(!x){o.items[id]=v;continue}
   o.items[id]={...x,...v,n:mx(x.n,v.n),done:mx(x.done,v.done),sh:mx(x.sh,v.sh),wpm:mx(x.wpm,v.wpm),turns:mx(x.turns,v.turns),days:mx(x.days,v.days),shN:mx(x.shN,v.shN),
    first:(x.first||"9")<(v.first||"9")?x.first:v.first,last:(x.last||"")>(v.last||"")?x.last:v.last,fb:(x.last||"")>(v.last||"")?x.fb:v.fb}}
  const m=new Map();[...(a.ev||[]),...(b.ev||[])].forEach(e=>m.set(e.at+"|"+e.id+"|"+e.w,e));o.ev=[...m.values()].sort((x,y)=>x.at<y.at?1:-1).slice(0,400);return o}
 if(k==="custom"){const m=new Map();[...b,...a].forEach(x=>{if(!m.has(x.id))m.set(x.id,x)});return[...m.values()].slice(0,60)}
 if(/^log-/.test(k)){const o={days:{...(a.days||{})}};for(const [d,v] of Object.entries(b.days||{})){const x={...(o.days[d]||{})};for(const [t,m] of Object.entries(v))x[t]=Math.max(x[t]||0,m);o.days[d]=x}return o}
 return a||b}
async function flushLib(){if(libT){clearTimeout(libT);libT=null;await save("library",LIB)}}
async function exportAll(){await flushLib();const all=await listAll();const data={};for(const [k,v] of Object.entries(all))if(DATA_KEY(k))data[k]=v;
 return {app:"noi-moi-ngay",version:2,exportedAt:new Date().toISOString(),data}}
async function applyData(data,mode,label){let n=0;
 for(const [k,v] of Object.entries(data||{})){if(!DATA_KEY(k))continue;const cur=mode==="replace"?null:await load(k,null);await save(k,mode==="replace"?v:mergeKey(k,cur,v));n++;if(label)label.textContent="Đang ghi "+n+"…"}
 for(const k of Object.keys(lessonCache))delete lessonCache[k];
 await loadAll();return n}

 }catch(e){throw{code:"network"}}
 if(r.status===401||r.status===403)throw{code:"bad_key"};if(r.status===429)throw{code:"rate_limited"};

/* --- Giọng đọc: speechSynthesis --- */
function enVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}catch(e){return[]}}
function pickVoice(which){const vs=enVoices();const want=which==="airy"?SET.voiceB:SET.voiceA;let v=vs.find(x=>x.voiceURI===want);
 if(!v){const pref=vs.filter(x=>/en[-_](US|GB)/i.test(x.lang));const pool=pref.length?pref:vs;v=which==="airy"?(pool[1]||pool[0]):pool[0]}return v||null}
function mkTTS(){if(!window.speechSynthesis)return null;const st=[],ln=[];let stop=false,rate=1;
 const setS=(s,reason)=>{ttsState=s;st.forEach(f=>f({state:s,reason}))};
 const one=(text,voice,r)=>new Promise(res=>{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";const v=pickVoice(voice);if(v)u.voice=v;u.rate=Math.max(.5,Math.min(1.6,r||1));u.onend=()=>res();u.onerror=()=>res();speechSynthesis.speak(u)});
 return{speak:async(x,o={})=>{speechSynthesis.cancel();stop=false;rate=o.rate||1;const lines=Array.isArray(x)?x:[{text:x,voice:o.voice}];setS("speaking");
   for(const l of lines){if(stop)break;ln.forEach(f=>f({line:l,id:l.id}));await one(l.text,l.voice||o.voice,l.rate||rate)}
   setS("idle",stop?"viewer_stopped":"completed")},
  stop:()=>{stop=true;speechSynthesis.cancel();setS("idle","viewer_stopped")},onState:f=>st.push(f),onLine:f=>ln.push(f)}}

/* --- Nhận giọng nói: Web Speech API --- */
function mkDict(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
 const P_=[],F_=[],S_=[];let rec=null,active=false,endRes=null;
 const emit=(arr,x)=>arr.forEach(f=>f(x));
 function startRec(){rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=!IS_IOS;rec.maxAlternatives=1;
  rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)emit(F_,{text:r[0].transcript.trim()});else interim+=r[0].transcript}emit(P_,{text:interim.trim()})};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){active=false;toast("Trình duyệt chặn mic — vào Cài đặt cho phép micro.")}};
  rec.onend=()=>{if(active){try{startRec();return}catch(e){active=false}}emit(S_,{state:"idle",reason:"stopped"});if(endRes){endRes();endRes=null}};
  rec.start()}
 return{start:()=>new Promise((res,rej)=>{try{active=true;startRec();emit(S_,{state:"listening"});res()}catch(e){active=false;rej({code:"dismissed"})}}),
  stop:()=>new Promise(res=>{active=false;endRes=res;try{rec&&rec.stop()}catch(e){res()}setTimeout(()=>{if(endRes){endRes();endRes=null}},2500)}),
  onPartial:f=>P_.push(f),onFinal:f=>F_.push(f),onState:f=>S_.push(f)}}

  if(r.status===401)throw{code:"bad_key"};if(!r.ok)throw{code:"api",message:"GitHub "+r.status};return r.json()},
 async pack(){await flushLib();const all=await listAll();const files={},lessons={};const meta={updated:+(localStorage.getItem("nmn-updated")||Date.now()),device:navigator.userAgent.slice(0,80)};
  const rest={};for(const [k,v] of Object.entries(all)){if(!DATA_KEY(k))continue;if(k.startsWith("lesson-"))lessons[k]=v;else rest[k]=v}
  files["nmn-meta.json"]={content:JSON.stringify(meta)};files["nmn-core.json"]={content:JSON.stringify(rest)};
  let chunk={},size=0,n=0;const flushC=()=>{if(!Object.keys(chunk).length)return;n++;files["nmn-lessons-"+n+".json"]={content:JSON.stringify(chunk)};chunk={};size=0};
  for(const [k,v] of Object.entries(lessons)){const s=JSON.stringify(v).length;if(size+s>700000)flushC();chunk[k]=v;size+=s}flushC();return{files,meta}},
 async fetchFiles(g){const out={};for(const [name,f] of Object.entries(g.files||{})){let c=f.content;if(f.truncated||c==null){const r=await fetch(f.raw_url);c=await r.text()}out[name]=c}return out},
 async remoteStamp(){const list=await this.api("/gists?per_page=100");const g=(list||[]).find(x=>x.id===SET.gist.id);return g?g.updated_at:null},
 ls(){try{return JSON.parse(localStorage.getItem("nmn-lastsync")||"{}")}catch(e){return{}}},
 setLs(o){localStorage.setItem("nmn-lastsync",JSON.stringify({...this.ls(),...o,at:Date.now()}))},
 async pull(silent){if(!SET.gist.token||!SET.gist.id)return false;const g=await this.api("/gists/"+SET.gist.id);const fs=await this.fetchFiles(g);
  const data={...JSON.parse(fs["nmn-core.json"]||"{}")};
  for(const [n,c] of Object.entries(fs))if(n.startsWith("nmn-lessons-"))Object.assign(data,JSON.parse(c));
  this.applying=true;try{await applyData(data,"merge")}finally{this.applying=false}
  this.setLs({dir:"pull",stamp:g.updated_at});if(!silent)toast("Đã tải dữ liệu từ đám mây");return true},
 async pullIfChanged(){if(!SET.gist.id)return false;const st=await this.remoteStamp();if(st&&st!==this.ls().stamp){await this.pull(true);return true}return false},
 async push(){if(!SET.gist.token||this.busy)return;this.busy=true;try{
  if(SET.gist.id)await this.pullIfChanged();
  const {files}=await this.pack();files["nmn-meta.json"]={content:JSON.stringify({updated:Date.now(),device:navigator.userAgent.slice(0,80)})};
  const lnames=Object.keys(files).filter(n=>n.startsWith("nmn-lessons-"));
  const sig=lnames.map(n=>files[n].content.length).join(",");const prev=this.ls();
  if(SET.gist.id&&prev.sig===sig){lnames.forEach(n=>delete files[n])}
  else if(SET.gist.id){for(let i=lnames.length+1;i<=(prev.nles||0);i++)files["nmn-lessons-"+i+".json"]=null}
  let g;if(SET.gist.id)g=await this.api("/gists/"+SET.gist.id,{method:"PATCH",body:JSON.stringify({files})});
  else{g=await this.api("/gists",{method:"POST",body:JSON.stringify({description:"Nói Mỗi Ngày — dữ liệu đồng bộ (riêng tư)",public:false,files})});SET.gist.id=g.id;saveSet()}
  this.setLs({dir:"push",stamp:g.updated_at,sig,nles:lnames.length})
  }finally{this.busy=false}}};

  <div class="row"><button class="pri sm" id="ssave">Lưu</button><button class="sm" id="stest">Thử AI</button></div><div id="smsg" class="small" style="margin-top:6px"></div></div>
  <div class="card" style="margin-top:14px"><h2>Đồng bộ tự động (GitHub)</h2><p class="small mut">Lưu dữ liệu vào một Gist <b>riêng tư</b> trên tài khoản GitHub miễn phí của bạn. Mỗi thiết bị nhập cùng token một lần.</p>
  <label class="small">GitHub token (quyền gist)<input id="gt" type="password" autocomplete="off" style="width:100%;margin:6px 0" value="${esc(SET.gist.token)}"></label>
  <label class="small">Gist ID <span class="tiny mut">(để trống ở thiết bị đầu tiên — app tự tạo; thiết bị sau dán ID này vào)</span><input id="gi" style="width:100%;margin:6px 0" value="${esc(SET.gist.id)}"></label>
  <label class="small row" style="gap:6px"><input type="checkbox" id="ga" class="cbx" ${SET.auto?"checked":""}> Tự đồng bộ khi mở app và sau mỗi thay đổi</label>
  <div class="row" style="margin-top:8px"><button class="pri sm" id="gsave">Lưu & đồng bộ</button><button class="sm" id="gpull">Tải về từ đám mây</button><button class="sm" id="gpush">Đẩy lên đám mây</button></div>
  <p class="tiny mut" style="margin-top:6px">${ls?"Lần đồng bộ gần nhất: "+new Date(ls.at).toLocaleString("vi-VN")+(ls.dir==="pull"?" (tải về)":" (đẩy lên)"):"Chưa đồng bộ."}</p><div id="gmsg" class="small"></div></div>
  <div class="card" style="margin-top:14px"><h2>Giọng đọc</h2>${vs.length?`<label class="small">Giọng A<select id="va" style="width:100%;margin:6px 0">${vo(SET.voiceA)}</select></label><label class="small">Giọng B<select id="vb" style="width:100%;margin:6px 0">${vo(SET.voiceB)}</select></label><button class="sm" id="vt">Nghe thử</button>`:`<p class="small mut">Chưa thấy giọng tiếng Anh — thêm giọng English trong cài đặt máy (iPad: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói).</p>`}
  <p class="tiny mut" style="margin-top:8px">Mic: ${caps.mic?"có thể dùng":"trình duyệt này không hỗ trợ — dùng Safari (iPad/iPhone) hoặc Chrome/Edge"}.</p></div>`},
 bindSettings(){const sp=$("#sp");
  sp.onchange=()=>{SET.provider=sp.value;saveSet();render()};
  $("#ssave").onclick=()=>{if(SET.provider!=="manual"){SET.keys[SET.provider]=$("#sk").value.trim();SET.models[SET.provider]=$("#sm").value.trim()||SET_DEF.models[SET.provider];const sb=$("#sb");if(sb)SET.base=sb.value.trim()}saveSet();toast("Đã lưu cài đặt AI")};
  $("#stest").onclick=async()=>{$("#ssave").click();const m=$("#smsg");m.textContent="Đang thử…";try{const r=await ask('Return ONLY JSON: {"ok":true,"hello":"a short friendly greeting in English"}',null,"quick");m.innerHTML=`<span class="w-ok">AI trả lời: ${esc(r.hello||"OK")}</span>`}catch(e){m.innerHTML=`<span style="color:var(--bad)">${esc(aiErr(e))}</span>`}};
  const gs=()=>{SET.gist.token=$("#gt").value.trim();SET.gist.id=$("#gi").value.trim();SET.auto=$("#ga").checked;saveSet();caps.store=SET.gist.token?"Đồng bộ GitHub":"Lưu trên thiết bị";setStatus()};
  const gm=(t,ok)=>{$("#gmsg").innerHTML=`<span style="color:${ok?"var(--ok)":"var(--bad)"}">${esc(t)}</span>`};
  const run=async f=>{gs();if(!SET.gist.token)return gm("Hãy dán GitHub token trước.");gm("Đang đồng bộ…",true);try{await f();render();setTimeout(()=>{const g=$("#gmsg");if(g)g.innerHTML=`<span class="w-ok">Xong. Gist ID: ${esc(SET.gist.id)}</span>`},50)}catch(e){gm(e.code==="bad_key"?"Token sai hoặc thiếu quyền gist.":(e.message||"Lỗi mạng"))}};
  $("#gsave").onclick=()=>run(async()=>{if(SET.gist.id&&!SYNC.ls().stamp)await SYNC.pull(true);await SYNC.push()});
  $("#gpull").onclick=()=>run(()=>SYNC.pull());
  $("#gpush").onclick=()=>run(()=>SYNC.push());
  const va=$("#va"),vb=$("#vb");if(va){va.onchange=()=>{SET.voiceA=va.value;saveSet()};vb.onchange=()=>{SET.voiceB=vb.value;saveSet()};$("#vt").onclick=()=>TTS&&TTS.speak([{text:"Hi! I'm voice A. Let's practise speaking.",voice:"buttery"},{text:"And I'm voice B. Nice to meet you!",voice:"airy"}])}},
 afterImport(){SYNC.dirty()},
 guideHTML:`<ol class="steps" style="max-width:75ch">
 <li><b>Đưa app lên mạng (một lần):</b> làm theo file <i>HUONG-DAN.txt</i> trong gói — tải thư mục lên GitHub Pages hoặc Netlify, bạn có một địa chỉ web riêng, miễn phí.</li>
 <li><b>Cài như app:</b> iPad/iPhone mở địa chỉ đó bằng Safari → nút Chia sẻ → <i>Thêm vào MH chính</i>. Android/máy tính dùng Chrome → <i>Cài đặt ứng dụng</i>.</li>
 <li><b>Chuyển dữ liệu từ bản Claude:</b> ở bản Claude bấm “Xuất file sao lưu” → ở đây bấm “Nhập file sao lưu” → chọn Gộp.</li>
 <li><b>Đồng bộ tự động:</b> nhập GitHub token ở thiết bị đầu tiên, bấm “Lưu & đồng bộ”, chép Gist ID sang các thiết bị khác cùng token. Mỗi lần mở app sẽ tự tải về, mỗi thay đổi tự đẩy lên sau 20 giây.</li>
 <li><b>Không muốn dùng GitHub:</b> cuối mỗi buổi bấm “Xuất file sao lưu”, lưu vào iCloud Drive / Google Drive, mở thiết bị kia bấm “Nhập” → Gộp.</li></ol>
 <p class="small mut">Nên học trên một thiết bị tại một thời điểm. Nếu hai thiết bị cùng học khi mất mạng, app sẽ gộp: lấy tiến độ xa hơn, giờ học lớn hơn và hợp nhất Sổ tay.</p>`};
init();
